name: Jessie Hub browser QA
on:
  workflow_run:
    workflows: ['Deploy JU Jessie Hub']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run browser QA against deployed site
        run: npx playwright test
        env:
          BASE_URL: https://lonniebeal-droid.github.io/ju-jessie-public/
